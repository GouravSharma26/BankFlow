name: BankFlow CI

on:
  push:
    branches: [main, "phase/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bankflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bankflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bankflow
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bankflow_test
      BANKFLOW_DB_HOST: localhost
      BANKFLOW_DB_PORT: "5432"
      BANKFLOW_DB_NAME: bankflow
      BANKFLOW_DB_USER: postgres
      BANKFLOW_DB_PASSWORD: postgres
      BANKFLOW_TEST_DB_NAME: bankflow_test
      BANKFLOW_REQUIRE_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository hygiene and git diff
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          echo "Verifying git hygiene for event: ${EVENT_NAME}"

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            TARGET_SHA="${{ github.sha }}"
            echo "Checking git diff between PR base (${BASE_SHA}) and head (${TARGET_SHA})..."
            git diff --check "${BASE_SHA}...${TARGET_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${BEFORE_SHA}" >/dev/null 2>&1; then
              echo "Checking git diff for push range: ${BEFORE_SHA}...${CURRENT_SHA}..."
              git diff --check "${BEFORE_SHA}...${CURRENT_SHA}"
            elif git rev-parse --verify origin/main >/dev/null 2>&1 && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "New branch push; checking git diff against origin/main..."
              git diff --check "origin/main...HEAD"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              echo "Checking git diff for commit: HEAD~1...HEAD..."
              git diff --check "HEAD~1...HEAD"
            else
              echo "Single commit repository; checking working tree..."
              git diff --check
            fi
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              echo "Workflow triggered by ${EVENT_NAME}; checking git diff for HEAD~1...HEAD..."
              git diff --check "HEAD~1...HEAD"
            else
              git diff --check
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,api]"

      - name: Create isolated integration-test database
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          try:
            with conn.cursor() as cur:
              cur.execute("SELECT 1 FROM pg_database WHERE datname = 'bankflow_test'")
              if not cur.fetchone():
                cur.execute("CREATE DATABASE bankflow_test")
          finally:
            conn.close()
          PY

      - name: Run complete test suite (integration tests required)
        run: |
          set -euo pipefail
          python -m pytest tests -v --tb=short --junitxml=pytest-junit.xml 2>&1 | tee pytest.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: |
            pytest.log
            pytest-junit.xml

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck / lint
        run: npm run lint

      - name: Run frontend unit and component tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
