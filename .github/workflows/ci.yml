name: BankFlow CI

on:
  push:
    branches: [main, phase/3-warehouse-loading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bankflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bankflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bankflow
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bankflow_test
      BANKFLOW_DB_HOST: localhost
      BANKFLOW_DB_PORT: "5432"
      BANKFLOW_DB_NAME: bankflow
      BANKFLOW_DB_USER: postgres
      BANKFLOW_DB_PASSWORD: postgres
      BANKFLOW_TEST_DB_NAME: bankflow_test
      BANKFLOW_REQUIRE_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Create isolated integration-test database
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1 FROM pg_database WHERE datname = 'bankflow_test'")
                  if not cur.fetchone():
                      cur.execute("CREATE DATABASE bankflow_test")
          finally:
              conn.close()
          PY

      - name: Run complete test suite (integration tests required)
        id: run_tests
        run: |
          python -m pytest tests -v --tb=short --junitxml=pytest-junit.xml 2>&1 | tee pytest.log
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: |
            pytest.log
            pytest-junit.xml

      - name: Evaluate test result
        run: |
          echo "=== PYTEST LOG START ==="
          cat pytest.log
          echo "=== PYTEST LOG END ==="
          python -c '
          import xml.etree.ElementTree as ET
          tree = ET.parse("pytest-junit.xml")
          root = tree.getroot()
          failures = int(root.attrib.get("failures", 0))
          errors = int(root.attrib.get("errors", 0))
          tests = int(root.attrib.get("tests", 0))
          print(f"Junit summary: {tests} tests, {failures} failures, {errors} errors")
          if failures > 0 or errors > 0:
              exit(1)
          '
