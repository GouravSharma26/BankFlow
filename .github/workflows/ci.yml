name: BankFlow CI

on:
  push:
    branches: [main, phase/3-warehouse-loading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bankflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bankflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bankflow
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bankflow_test
      BANKFLOW_REQUIRE_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Create isolated integration-test database
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1 FROM pg_database WHERE datname = 'bankflow_test'")
                  if not cur.fetchone():
                      cur.execute("CREATE DATABASE bankflow_test")
          finally:
              conn.close()
          PY

      - name: Run complete test suite (integration tests required)
        run: python -m pytest tests -v
